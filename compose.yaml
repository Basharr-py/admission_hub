services:
    fast-api:
        container_name: fast-api-container
        restart: unless-stopped
        networks:
            - backend
            - frontend
        image: basharr99/fast-api:1.0
        volumes:
            - fast-db:/var/lib/postgresql/data
            - ./app:/frontend
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
            interval: 100s
            timeout: 5s
            retries: 5
        depends_on:
            db:
                condition: service_healthy

    fast-api_v2:
        
        container_name: fast-api-v2-cont
        restart: unless-stopped
        networks:
            - backend
            - frontend
        image: basharr99/fast-api:1.1
        volumes:
            - fast-db:/var/lib/postgresql/data
          
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]               
            interval: 100s
            timeout: 5s
            retries: 5
        depends_on:
            db:
                condition: service_healthy

            
    db:
        image: postgres:16
        restart: unless-stopped
        environment: 
            - POSTGRES_DB=${DATABASE_NAME}
            - POSTGRES_USER=${DATABASE_USER}
            - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - backend
        container_name: postgres-container

    app-frontend1:
        build:
            context: aggregate-calc-frontend/.
            dockerfile: Dockerfile
        healthcheck:
            interval: 100s
            retries: "3"
            timeout: 5s
        networks:
            - frontend
        ports:
            - 8080:80
        container_name: agg-calc-frontend
        image: app-frontend1
    nginx:
        ports:
            - 80:80
            - 443:443
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - /etc/letsencrypt:/etc/letsencrypt:ro

        container_name: nginx-cont
        image: nginx:alpine
        networks:
            - frontend
        depends_on:
            db:
                condition: service_healthy

networks:
    frontend:
        name: frontend
    backend:
        name: backend

volumes:
    fast-db:
    pgdata:
